<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin | Desa Semparuk</title>

    <meta name="description" content="Login administrator website resmi Desa Semparuk">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --blue-900:#0b2d4d;
            --blue-800:#10456f;
            --blue-700:#17639a;
            --blue-500:#3a87d8;
            --blue-300:#8ec4f2;
            --blue-100:#e8f3fe;
            --white:#ffffff;
            --text:#16324a;
            --muted:#718397;
            --danger:#c0392b;
            --shadow:0 25px 70px rgba(8,45,77,.18);
        }

        body{
            min-height:100vh;
            font-family:Arial,Helvetica,sans-serif;
            color:var(--text);
            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(142,196,242,.45),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(58,135,216,.22),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #f7fbff 0%,
                    #eaf5ff 48%,
                    #dceeff 100%
                );
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            position:relative;
            overflow:hidden;
        }

        body::before{
            content:"";
            position:absolute;
            width:420px;
            height:420px;
            border-radius:50%;
            background:rgba(255,255,255,.45);
            top:-220px;
            right:-150px;
            filter:blur(4px);
        }

        body::after{
            content:"";
            position:absolute;
            width:300px;
            height:300px;
            border-radius:50%;
            background:rgba(58,135,216,.08);
            bottom:-160px;
            left:-120px;
        }

        .login-wrapper{
            width:100%;
            max-width:440px;
            position:relative;
            z-index:2;
        }

        .login-card{
            background:rgba(255,255,255,.94);
            border:1px solid rgba(255,255,255,.8);
            border-radius:28px;
            padding:38px 34px 32px;
            box-shadow:var(--shadow);
            backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);
        }

        .brand{
            text-align:center;
            margin-bottom:30px;
        }

        .brand-logo{
            width:70px;
            height:70px;
            margin:0 auto 17px;
            border-radius:20px;
            display:flex;
            align-items:center;
            justify-content:center;
            color:white;
            font-family:Georgia,"Times New Roman",serif;
            font-size:25px;
            font-weight:bold;
            letter-spacing:-1px;
            background:
                linear-gradient(
                    145deg,
                    var(--blue-700),
                    var(--blue-500)
                );
            box-shadow:
                0 12px 28px rgba(37,107,184,.28);
        }

        .brand h1{
            font-family:Georgia,"Times New Roman",serif;
            font-size:27px;
            line-height:1.2;
            color:var(--blue-900);
            margin-bottom:7px;
        }

        .brand p{
            color:var(--muted);
            font-size:13px;
            line-height:1.6;
        }

        .form-group{
            margin-bottom:18px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-size:13px;
            font-weight:700;
            color:var(--blue-900);
        }

        .input-wrapper{
            position:relative;
        }

        .input-icon{
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:var(--blue-500);
            font-size:16px;
            pointer-events:none;
        }

        .form-control{
            width:100%;
            height:50px;
            padding:0 15px 0 44px;
            border:1px solid #d6e3ee;
            border-radius:13px;
            outline:none;
            background:#f9fcff;
            color:var(--text);
            font-size:14px;
            transition:.2s ease;
        }

        .form-control::placeholder{
            color:#a1afbc;
        }

        .form-control:focus{
            border-color:var(--blue-500);
            background:white;
            box-shadow:0 0 0 4px rgba(58,135,216,.10);
        }

        .login-button{
            width:100%;
            height:51px;
            margin-top:7px;
            border:none;
            border-radius:13px;
            background:
                linear-gradient(
                    135deg,
                    var(--blue-700),
                    var(--blue-500)
                );
            color:white;
            font-size:14px;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 10px 25px rgba(37,107,184,.23);
            transition:.2s ease;
        }

        .login-button:hover{
            transform:translateY(-1px);
            box-shadow:0 14px 30px rgba(37,107,184,.28);
        }

        .login-button:active{
            transform:translateY(0);
        }

        .login-button:disabled{
            opacity:.7;
            cursor:not-allowed;
            transform:none;
        }

        .message{
            display:none;
            margin-bottom:17px;
            padding:12px 14px;
            border-radius:11px;
            font-size:13px;
            line-height:1.5;
        }

        .message.show{
            display:block;
        }

        .message.error{
            color:#8e2b21;
            background:#fff0ee;
            border:1px solid #f4ccc7;
        }

        .message.success{
            color:#17643b;
            background:#edf9f2;
            border:1px solid #c9ead7;
        }

        .back-link{
            display:flex;
            justify-content:center;
            margin-top:22px;
        }

        .back-link a{
            color:var(--blue-700);
            text-decoration:none;
            font-size:13px;
            font-weight:600;
        }

        .back-link a:hover{
            text-decoration:underline;
        }

        .security-note{
            margin-top:24px;
            padding-top:20px;
            border-top:1px solid #e7eef5;
            text-align:center;
            color:#8998a7;
            font-size:11px;
            line-height:1.6;
        }

        .loading{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }

        .spinner{
            width:15px;
            height:15px;
            border:2px solid rgba(255,255,255,.45);
            border-top-color:white;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

        @media(max-width:480px){
            body{
                padding:18px;
            }

            .login-card{
                padding:32px 23px 27px;
                border-radius:24px;
            }

            .brand h1{
                font-size:24px;
            }

            .brand-logo{
                width:64px;
                height:64px;
                border-radius:18px;
            }
        }
    </style>
</head>

<body>

    <main class="login-wrapper">
        <section class="login-card">

            <div class="brand">
                <div class="brand-logo">DS</div>

                <h1>Admin Desa Semparuk</h1>

                <p>
                    Masuk ke panel administrator<br>
                    Pemerintah Desa Semparuk
                </p>
            </div>

            <div id="message" class="message"></div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="username">Username</label>

                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Masukkan username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Masuk ke Panel Admin
                </button>

            </form>

            <div class="back-link">
                <a href="../index.html">
                    ← Kembali ke Website Desa
                </a>
            </div>

            <div class="security-note">
                Halaman khusus administrator Pemerintah Desa Semparuk.
            </div>

        </section>
    </main>

    <script>
        const API_URL =
            "https://script.google.com/macros/s/AKfycbybc2PsScGI9_h0x0Uo_bVPmv28vWG5u8JkfrA3qmPIwgs7QbIk3wqCrzb4yBafnilatQ/exec";

        const loginForm=document.getElementById("loginForm");
        const loginButton=document.getElementById("loginButton");
        const message=document.getElementById("message");

        function showMessage(text,type){
            message.textContent=text;
            message.className="message show "+type;
        }

        function setLoading(loading){
            loginButton.disabled=loading;

            if(loading){
                loginButton.innerHTML=`
                    <span class="loading">
                        <span class="spinner"></span>
                        Memproses login...
                    </span>
                `;
            }else{
                loginButton.textContent="Masuk ke Panel Admin";
            }
        }

        loginForm.addEventListener("submit",async function(event){
            event.preventDefault();

            const username=
                document.getElementById("username").value.trim();

            const password=
                document.getElementById("password").value;

            if(!username||!password){
                showMessage(
                    "Username dan password wajib diisi.",
                    "error"
                );
                return;
            }

            showMessage("","success");
            message.classList.remove("show");

            setLoading(true);

            try{
                const response=await fetch(API_URL,{
                    method:"POST",
                    headers:{
                        "Content-Type":"text/plain;charset=utf-8"
                    },
                    body:JSON.stringify({
                        action:"adminlogin",
                        username:username,
                        password:password
                    })
                });

                const result=await response.json();

                if(!result.success){
                    showMessage(
                        result.message||"Login gagal.",
                        "error"
                    );

                    setLoading(false);
                    return;
                }

                sessionStorage.setItem(
                    "adminSession",
                    result.session
                );

                sessionStorage.setItem(
                    "adminData",
                    JSON.stringify(result.admin)
                );

                showMessage(
                    "Login berhasil. Mengalihkan ke dashboard...",
                    "success"
                );

                setTimeout(function(){
                    window.location.href="dashboard.html";
                },700);

            }catch(error){
                console.error(error);

                showMessage(
                    "Tidak dapat terhubung ke server. Periksa koneksi internet.",
                    "error"
                );

                setLoading(false);
            }
        });
    </script>

</body>
</html>
